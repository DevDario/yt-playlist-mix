name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64.exe
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp textual static-ffmpeg

      - name: Fetch static ffmpeg/ffprobe
        run: |
          python - <<'EOF'
          import os
          import pathlib
          import shutil
          import static_ffmpeg

          tools = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise()
          out = pathlib.Path("ffmpeg-bin")
          out.mkdir(exist_ok=True)
          for src in tools:
              shutil.copy(src, out / os.path.basename(src))
          print("ffmpeg-bin:", sorted(p.name for p in out.iterdir()))
          EOF

      - name: Build macOS .icns icon
        if: runner.os == 'macOS'
        run: iconutil -c icns assets/iconset -o assets/icon.icns

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm yt-playlist-mix.spec

      - name: Smoke test the executable
        shell: bash
        run: "./dist/YouTubePlaylistMixer$( [ '${{ runner.os }}' = Windows ] && echo '.exe' ) --version"

      - name: Tag a branded, versioned artifact name
        id: artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [[ "$GITHUB_REF" == refs/heads/* ]]; then
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv dist/YouTubePlaylistMixer* "dist/YouTubePlaylistMixer-$VERSION-${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePlaylistMixer-${{ matrix.suffix }}
          path: dist/YouTubePlaylistMixer-*-${{ matrix.suffix }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: YouTube Playlist Mixer ${{ steps.artifact.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/YouTubePlaylistMixer-*-${{ matrix.suffix }}