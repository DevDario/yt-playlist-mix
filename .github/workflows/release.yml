name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp textual

      - name: Download static ffmpeg + ffprobe
        shell: bash
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          tar -xf ffmpeg.zip
          mkdir -p ffmpeg-bin
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe ffmpeg-bin/
          cp ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe ffmpeg-bin/

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm yt-playlist-mix.spec

      - name: Smoke test the exe
        shell: bash
        run: ./dist/YouTubePlaylistMixer.exe --version || ./dist/YouTubePlaylistMixer.exe --help || exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePlaylistMixer-windows
          path: dist/YouTubePlaylistMixer.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTubePlaylistMixer.exe